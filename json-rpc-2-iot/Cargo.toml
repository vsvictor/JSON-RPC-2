[package]
name = "json-rpc-2-iot"
version = "0.1.0"
edition = "2024"
description = "IoT-oriented JSON-RPC 2.0 transport implementations (MQTT, CoAP, AMQP)"

[features]
default = ["mqtt", "coap", "amqp"]
mqtt = []
coap = []
amqp = []

[dependencies]
bytes = "1"
json-rpc-2-core = { path = "../json-rpc-2-core" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
