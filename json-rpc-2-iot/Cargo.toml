[package]
name = "json-rpc-2-iot"
version = "0.1.0"
edition = "2024"
description = "Client-only IoT JSON-RPC 2.0 transports (MQTT, CoAP, AMQP)"

[features]
default = ["mqtt", "coap", "amqp"]
mqtt = ["dep:rumqttc", "dep:rustls"]
coap = []
amqp = ["dep:lapin", "dep:futures-util"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", optional = true }
lapin = { version = "4.12", default-features = false, features = ["tokio", "rustls--ring", "rustls-native-certs"], optional = true }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "url"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
json-rpc-2-core = { path = "../json-rpc-2-core" }
json-rpc-2-transport = { path = "../json-rpc-2-transport" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
gateway-iot = { git = "https://github.com/vsvictor/JSON-RPC-2-GATEWAY.git", branch = "master", default-features = false, features = ["mqtt", "coap", "amqp"] }
