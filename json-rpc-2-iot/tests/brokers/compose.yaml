services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    command: ["sh", "-c", "mosquitto_passwd -b -c /mosquitto/data/test-passwords rpc-test rpc-test && chown mosquitto:mosquitto /mosquitto/data/test-passwords && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    ports:
      - "127.0.0.1:18883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  amqp:
    image: rabbitmq:4.1.8-alpine
    ports:
      - "127.0.0.1:56723:5672"
    environment:
      RABBITMQ_DEFAULT_USER: rpc-test
      RABBITMQ_DEFAULT_PASS: rpc-test
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 40
