[package]
name = "json-rpc-2-server"
version = "0.1.0"
edition = "2024"
description = "JSON-RPC 2.0 protocol dispatcher"

[features]
default = []
tcp = []
udp = []
rtp = []
rudp = []
srt = []
udplite = []
dccp = []
sctp = []
quic = []
http1 = []
http3 = []
websocket = []
mqtt = []
coap = []
amqp = []

[dependencies]
anyhow = "1"
arc-swap = "1"
bytes = "1"
json-rpc-2-core = { path = "../json-rpc-2-core" }
json-rpc-2-transport = { path = "../json-rpc-2-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
json-rpc-2-tcp = { path = "../json-rpc-2-tcp", default-features = false, features = ["http1"] }
proptest = "1"
tokio-test = "0.4"
jsonrpsee = { version = "0.24", features = ["http-client"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bench]]
name = "rpc_dispatch"
harness = false
