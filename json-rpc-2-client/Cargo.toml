[package]
name = "json-rpc-2-client"
version = "0.1.0"
edition = "2024"
description = "JSON-RPC 2.0 client independent of concrete network transports"

[features]
default = []
tcp = []
udp = []
rtp = []
rudp = []
srt = []
udplite = []
dccp = []
sctp = []
mqtt = []
coap = []
amqp = []
quic = []
http1 = []
http3 = []
websocket = []

[dependencies]
bytes = "1"
json-rpc-2-core = { path = "../json-rpc-2-core" }
json-rpc-2-transport = { path = "../json-rpc-2-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
json-rpc-2-server = { path = "../json-rpc-2-server" }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[bench]]
name = "client_hot_path"
harness = false
