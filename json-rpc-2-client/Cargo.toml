[package]
name = "json-rpc-2-client"
version = "0.1.0"
edition = "2024"
description = "JSON-RPC 2.0 client and transport adapters"

[features]
default = ["tcp", "udp", "rtp", "rudp", "srt", "udplite", "dccp", "sctp", "quic", "http1", "http3", "websocket", "mqtt", "coap", "amqp"]
tcp = []
udp = []
rtp = []
rudp = []
srt = []
udplite = []
dccp = []
sctp = []
mqtt = []
coap = []
amqp = []
quic = ["dep:quinn"]
http1 = ["dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util"]
http3 = ["dep:h3", "dep:h3-quinn", "dep:http", "dep:quinn"]
websocket = ["rtp", "rudp", "srt", "udplite", "mqtt", "coap", "amqp", "dep:tokio-tungstenite", "dep:http", "dep:h3", "dep:h3-quinn", "dep:quinn"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
json-rpc-2-core = { path = "../json-rpc-2-core" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "stream"], optional = true }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
json-rpc-2-server = { path = "../json-rpc-2-server" }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[bench]]
name = "client_hot_path"
harness = false
