[package]
name = "json-rpc-2-transport"
version = "0.1.0"
edition = "2024"
description = "Transport contracts and shared runtime primitives for JSON-RPC 2.0"

[dependencies]
bytes = "1"
http-body = "1"
json-rpc-2-core = { path = "../json-rpc-2-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt"] }
