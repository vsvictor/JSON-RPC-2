[package]
name = "json-rpc-2-websockets"
version = "0.1.0"
edition = "2024"
description = "WebSocket-family JSON-RPC 2.0 transport implementations"

[features]
default = ["websocket", "tcp", "udp", "rtp", "rudp", "srt", "udplite", "dccp", "sctp", "quic", "http1", "http3", "mqtt", "coap", "amqp"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "dep:base64", "dep:http", "dep:h3", "dep:h3-quinn", "dep:quinn", "dep:axum"]
tcp = ["json-rpc-2-tcp/tcp"]
udp = ["json-rpc-2-datagram/udp"]
rtp = ["json-rpc-2-datagram/rtp"]
rudp = ["json-rpc-2-datagram/rudp"]
srt = ["json-rpc-2-datagram/srt"]
udplite = ["json-rpc-2-datagram/udplite"]
dccp = ["json-rpc-2-datagram/dccp"]
sctp = ["json-rpc-2-datagram/sctp"]
quic = ["json-rpc-2-quic/quic", "dep:quinn"]
http1 = ["json-rpc-2-tcp/http1"]
http3 = ["json-rpc-2-quic/http3", "dep:h3", "dep:h3-quinn", "dep:http", "dep:quinn"]
mqtt = ["json-rpc-2-iot/mqtt"]
coap = ["json-rpc-2-iot/coap"]
amqp = ["json-rpc-2-iot/amqp"]

[dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
base64 = { version = "0.22", optional = true }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = { version = "1", optional = true }
json-rpc-2-core = { path = "../json-rpc-2-core" }
json-rpc-2-datagram = { path = "../json-rpc-2-datagram", default-features = false }
json-rpc-2-iot = { path = "../json-rpc-2-iot", default-features = false }
json-rpc-2-quic = { path = "../json-rpc-2-quic", default-features = false }
json-rpc-2-tcp = { path = "../json-rpc-2-tcp", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "stream"], optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
