[package]
name = "json-rpc-2-ext"
version = "0.1.0"
edition = "2024"
description = "JSON-RPC 2.0 event subscriptions and publish extension"

[dependencies]
json-rpc-2-core = { path = "../json-rpc-2-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
