[package]
name = "json-rpc-2-core"
version = "0.1.0"
edition = "2024"
description = "Shared JSON-RPC 2.0 wire types and protocol constants"

[dependencies]
aes-gcm = "0.10"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
