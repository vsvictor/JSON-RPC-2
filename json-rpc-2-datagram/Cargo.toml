[package]
name = "json-rpc-2-datagram"
version = "0.1.0"
edition = "2024"
description = "Datagram and message-oriented JSON-RPC 2.0 transport implementations"

[features]
default = ["udp", "rtp", "rudp", "srt", "udplite", "dccp", "sctp"]
udp = ["json-rpc-2-client/udp", "json-rpc-2-server/udp"]
rtp = ["json-rpc-2-client/rtp", "json-rpc-2-server/rtp"]
rudp = ["json-rpc-2-client/rudp", "json-rpc-2-server/rudp"]
srt = ["json-rpc-2-client/srt", "json-rpc-2-server/srt"]
udplite = ["json-rpc-2-client/udplite", "json-rpc-2-server/udplite"]
dccp = ["json-rpc-2-client/dccp", "json-rpc-2-server/dccp"]
sctp = ["json-rpc-2-client/sctp", "json-rpc-2-server/sctp"]

[dependencies]
bytes = "1"
json-rpc-2-client = { path = "../json-rpc-2-client", default-features = false }
json-rpc-2-core = { path = "../json-rpc-2-core" }
json-rpc-2-server = { path = "../json-rpc-2-server", default-features = false }
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
