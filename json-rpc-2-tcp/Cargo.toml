[package]
name = "json-rpc-2-tcp"
version = "0.1.0"
edition = "2024"
description = "TCP-based JSON-RPC 2.0 transport implementations"

[features]
default = ["tcp", "http1"]
tcp = []
http1 = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
json-rpc-2-core = { path = "../json-rpc-2-core" }
socket2 = "0.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "stream"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
