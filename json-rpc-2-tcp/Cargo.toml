[package]
name = "json-rpc-2-tcp"
version = "0.1.0"
edition = "2024"
description = "TCP-based JSON-RPC 2.0 transport implementations"

[features]
default = ["tcp", "http1", "tls"]
tcp = []
http1 = []
tls = ["dep:rustls", "dep:tokio-rustls"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
json-rpc-2-core = { path = "../json-rpc-2-core" }
json-rpc-2-transport = { path = "../json-rpc-2-transport" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-util = { version = "0.7", features = ["codec", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
